<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naidu Family Tree Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header & Search Bar -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="cursor-pointer flex items-center gap-2" onclick="showMainView()">
                <span class="text-2xl font-bold tracking-tight">🌳 Naidu Family Portal</span>
            </div>
            <div class="w-full md:w-96 relative">
                <input type="text" id="searchInput" placeholder="Search family member, spouse, child..." 
                    class="w-full bg-blue-800/60 text-white placeholder-blue-300 px-4 py-2 rounded-full border border-blue-700 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm"
                    oninput="handleSearch(this.value)">
                <div id="searchResults" class="absolute left-0 right-0 mt-2 bg-white text-slate-800 rounded-xl shadow-2xl overflow-hidden hidden z-50 max-h-80 overflow-y-auto border border-slate-200"></div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main id="appContainer" class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <!-- Content will be dynamically loaded here -->
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm border-t border-slate-800">
        <p>&copy; 2026 Naidu Family Tree Portal. Live synced with Google Sheets.</p>
    </footer>

    <!-- Script to Fetch CSV and Render Portal -->
    <script>
        // ⚠️ APNI GOOGLE SHEET KI PUBLISHED CSV LINK YAHAN PASTE KAREIN ⚠️
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuCfhmRW8qR-EIoDKG3HXPGnZiGHsHkyOrgHBJUCKel0j_92TBPwsFIuf1_1dY-sY04fAfxc5g1QfD/pub?gid=0&single=true&output=csv";

        let familyData = [];

        async function loadFamilyData() {
            if(!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes("YOUR_PUBLISHED_CSV")) {
                renderDefaultView();
                return;
            }
            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                const csvText = await response.text();
                familyData = parseCSV(csvText);
                renderMainTree();
            } catch (error) {
                console.error("Error loading CSV:", error);
                renderDefaultView();
            }
        }

        // Simple CSV Parser
        function parseCSV(text) {
            let lines = text.split("\n");
            let result = [];
            for(let i=1; i<lines.length; i++) {
                if(!lines[i].trim()) continue;
                let row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                let cleanRow = row.map(val => val.replace(/^"|"$/g, '').trim());
                if(cleanRow.length >= 2) {
                    result.push({
                        branchNum: cleanRow[0],
                        head: cleanRow[1],
                        spouse: cleanRow[2],
                        status: cleanRow[3],
                        childrenName: cleanRow[4] ? cleanRow[4].split(',').map(s=>s.trim()) : [],
                        role: cleanRow[5] ? cleanRow[5].split(',').map(s=>s.trim()) : [],
                        age: cleanRow[6],
                        spouseName: cleanRow[7],
                        grandchildren: cleanRow[8] ? cleanRow[8].split(',').map(s=>s.trim()) : []
                    });
                }
            }
            return result;
        }

        function renderDefaultView() {
            document.getElementById('appContainer').innerHTML = `
                <div class="text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                    <h2 class="text-2xl font-bold text-slate-800 mb-4">Google Sheet Link Missing</h2>
                    <p class="text-slate-600 mb-6">Please paste your published Google Sheet CSV link in the <code>GOOGLE_SHEET_CSV_URL</code> variable inside the script tag.</p>
                </div>
            `;
        }

        function renderMainTree() {
            let html = `
                <div class="text-center mb-12">
                    <div class="inline-block bg-amber-100 text-amber-800 font-semibold px-4 py-1.5 rounded-full text-sm mb-3 shadow-sm border border-amber-200">Root Family Lineage</div>
                    <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">Late Shri Gopal Rao Chirnjivlu Naidu</h1>
                    <p class="text-slate-600 mt-2 max-w-xl mx-auto">Explore all 13 primary family branches, spouses, children, and generational hierarchy below.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            `;

            familyData.forEach(branch => {
                html += `
                    <div onclick="openBranch('${branch.branchNum}')" class="bg-white rounded-2xl p-6 shadow-sm hover:shadow-md transition border border-slate-200 cursor-pointer flex flex-col justify-between group">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-full">Branch #${branch.branchNum}</span>
                                <span class="text-xs text-slate-500 font-medium">${branch.status || ''}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition">${branch.head}</h3>
                            ${branch.spouse ? `<p class="text-xs text-slate-500 mt-1">Spouse: ${branch.spouse}</p>` : ''}
                            <div class="mt-4 pt-4 border-t border-slate-100">
                                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Children (${branch.childrenName.length})</p>
                                <div class="flex flex-wrap gap-1.5">
                                    ${branch.childrenName.map(c => `<span class="bg-slate-100 text-slate-700 text-xs px-2 py-0.5 rounded-md">${c}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="mt-6 flex items-center justify-between text-blue-600 text-sm font-semibold">
                            <span>View Branch Hierarchy</span>
                            <span class="transform group-hover:translate-x-1 transition">&rarr;</span>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            document.getElementById('appContainer').innerHTML = html;
        }

        function openBranch(branchNum) {
            const branch = familyData.find(b => b.branchNum == branchNum);
            if(!branch) return;

            window.scrollTo({top: 0, behavior: 'smooth'});
            document.getElementById('appContainer').innerHTML = `
                <button onclick="renderMainTree()" class="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-blue-600 bg-blue-50 px-4 py-2 rounded-xl hover:bg-blue-100 transition">
                    &larr; Back to All Branches
                </button>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
                    <div class="flex flex-wrap justify-between items-start gap-4 mb-6 pb-6 border-b border-slate-100">
                        <div>
                            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Branch #${branch.branchNum}</span>
                            <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mt-2">${branch.head}</h1>
                            ${branch.spouse ? `<p class="text-sm text-slate-600 mt-1">Spouse: <span class="font-medium text-slate-800">${branch.spouse}</span></p>` : ''}
                        </div>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-4">Children & Descendants</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${branch.childrenName.map((child, idx) => `
                            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                                <div class="flex justify-between items-start">
                                    <h4 class="font-bold text-slate-900">${child}</h4>
                                    <span class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-medium">${branch.role[idx] || 'Child'}</span>
                                </div>
                                ${branch.spouseName && branch.spouseName !== '-' ? `<p class="text-xs text-slate-500 mt-2">Married to: <span class="text-slate-700 font-medium">${branch.spouseName}</span></p>` : ''}
                                ${branch.grandchildren.length > 0 ? `
                                    <div class="mt-3 pt-3 border-t border-slate-200">
                                        <p class="text-xs font-bold text-slate-400 uppercase">Grandchildren</p>
                                        <div class="flex flex-wrap gap-1 mt-1">
                                            ${branch.grandchildren.map(g => `<span class="bg-amber-100 text-amber-900 text-xs px-2 py-0.5 rounded">${g}</span>`).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function handleSearch(query) {
            const resultsBox = document.getElementById('searchResults');
            if(!query.trim()) {
                resultsBox.classList.add('hidden');
                return;
            }
            const q = query.toLowerCase();
            let matches = [];

            familyData.forEach(b => {
                if(b.head.toLowerCase().includes(q) || (b.spouse && b.spouse.toLowerCase().includes(q))) {
                    matches.push({name: `${b.head} (Branch #${b.branchNum})`, branchNum: b.branchNum});
                }
                b.childrenName.forEach(c => {
                    if(c.toLowerCase().includes(q)) {
                        matches.push({name: `${c} (Child under Branch #${b.branchNum})`, branchNum: b.branchNum});
                    }
                });
                b.grandchildren.forEach(g => {
                    if(g.toLowerCase().includes(q)) {
                        matches.push({name: `${g} (Grandchild under Branch #${b.branchNum})`, branchNum: b.branchNum});
                    }
                });
            });

            if(matches.length > 0) {
                resultsBox.innerHTML = matches.slice(0, 5).map(m => `
                    <div onclick="openBranch('${m.branchNum}'); document.getElementById('searchResults').classList.add('hidden'); document.getElementById('searchInput').value='';" 
                         class="px-4 py-3 hover:bg-slate-100 cursor-pointer text-sm font-medium border-b border-slate-100 last:border-b-0">
                        ${m.name}
                    </div>
                `).join('');
                resultsBox.classList.remove('hidden');
            } else {
                resultsBox.innerHTML = `<div class="px-4 py-3 text-sm text-slate-500">No family member found</div>`;
                resultsBox.classList.remove('hidden');
            }
        }

        document.addEventListener('click', (e) => {
            if(!e.target.closest('#searchInput') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').classList.add('hidden');
            }
        });

        loadFamilyData();
    </script>
</body>
</html>
