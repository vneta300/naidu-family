<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naidu Family Tree Portal</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 bg-brand-900 text-white shadow-lg border-b border-gold-500/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('home')">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-gold-500 to-amber-300 flex items-center justify-center text-brand-900 font-bold text-xl">N</div>
                <div>
                    <h1 class="text-base sm:text-xl font-bold text-amber-100">Naidu Family Portal</h1>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="admin-toggle-btn" onclick="toggleAdminModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-xs font-semibold text-amber-300 border border-gold-500/30">
                    <span id="admin-btn-text">Admin Login</span>
                </button>
            </div>
        </div>
    </header>

    <div id="admin-banner" class="hidden bg-amber-500 text-brand-900 px-4 py-2 text-xs font-bold flex items-center justify-between">
        <span>Admin Mode Enabled — You can now add/edit photos for all branches, children & grandchildren.</span>
        <button onclick="logoutAdmin()" class="underline">Logout</button>
    </div>

    <main id="app-container" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 relative"></main>

    <!-- Edit Modal -->
    <div id="modal-edit-member" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl relative my-8 max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('modal-edit-member')" class="absolute top-4 right-4 text-slate-400">✕</button>
            <h3 id="edit-modal-title" class="text-xl font-bold mb-4 pb-2 border-b">Edit Member</h3>
            
            <form onsubmit="saveMemberChanges(event)" class="space-y-4">
                <input type="hidden" id="edit-branch-id">
                <input type="hidden" id="edit-member-type">
                <input type="hidden" id="edit-child-index">
                <input type="hidden" id="edit-gc-index">

                <div class="space-y-2">
                    <label class="block text-xs font-bold uppercase text-slate-500">Profile Photo</label>
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 rounded-full bg-slate-100 border-2 border-slate-300 overflow-hidden flex items-center justify-center">
                            <img id="photo-preview-img" src="" alt="Preview" class="w-full h-full object-cover hidden">
                            <span id="photo-preview-fallback" class="text-xs text-slate-400">No Photo</span>
                        </div>
                        <div class="flex-1 space-y-1 text-xs">
                            <input type="file" accept="image/*" onchange="handlePhotoUpload(this)" class="block w-full text-xs text-slate-500">
                            <input type="text" id="edit-photo-url" placeholder="Or paste image URL" oninput="previewPhotoUrl(this.value)" class="w-full p-1.5 border rounded text-xs">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name *</label>
                        <input type="text" id="edit-name" required class="w-full p-2 border rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Spouse Name</label>
                        <input type="text" id="edit-spouse" placeholder="Spouse Name" class="w-full p-2 border rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Age</label>
                        <input type="number" id="edit-age" placeholder="Age" class="w-full p-2 border rounded text-sm">
                    </div>
                </div>

                <div class="pt-2 flex justify-end space-x-2">
                    <button type="button" onclick="closeModal('modal-edit-member')" class="px-4 py-2 bg-slate-200 text-xs font-bold rounded">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-brand-800 text-white text-xs font-bold rounded">Save Details</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const defaultFamilyData = {
            root: { head: "Late Shri Gopal Rao Chirnjivlu Naidu", spouse: "Late Smt. Narayan Amma", photo: "", spousePhoto: "" },
            branches: [
                { id: "b1", branchNum: 1, head: "Late Shri R. Krishna Rao Gopal Rao Naidu", spouse: "R. Pushplata Rao", status: "Alive", children: [{ name: "Arun Kumar Naidu", grandchildren: [] }, { name: "Vijay Kumar Naidu", grandchildren: [] }] },
                { id: "b2", branchNum: 2, head: "Late Smt. K. Kamla Rao", spouse: "Late Shri Gopal Rao Naidu", status: "Deceased", children: [{ name: "Umashankar Naidu", grandchildren: [] }] },
                { id: "b3", branchNum: 3, head: "Late Shri R. Venu Rao Gopal Rao Naidu", spouse: "Late Smt. Venu Rao Naidu", status: "Deceased", children: [{ name: "Shrinivas Rao", grandchildren: [] }, { name: "Shiv Narayan Rao", grandchildren: [] }] },
                { id: "b4", branchNum: 4, head: "Late Shri R. Prabhakar Rao Gopal Rao Naidu", spouse: "Late Smt. Nirmala Rao", status: "Deceased", children: [{ name: "Anjana Rao", grandchildren: [] }, { name: "Kanchana Rao", grandchildren: [] }] },
                { id: "b5", branchNum: 5, head: "Late Shri R. Bhaskar Rao Gopal Rao Naidu", spouse: "Smt. Rajeshwari Naidu", status: "Head Deceased", children: [{ name: "Jayshree Naidu", grandchildren: [] }, { name: "Manju Naidu", grandchildren: [] }, { name: "Dinesh Naidu", grandchildren: [] }] },
                { id: "b6", branchNum: 6, head: "Late Shri R. Raja Rao Gopal Rao Naidu", spouse: "Late Smt. R. Vimal Naidu", status: "Deceased", children: [{ name: "Santosh Naidu", grandchildren: [] }, { name: "Sushil Naidu", grandchildren: [] }, { name: "Ragini Naidu", grandchildren: [] }] },
                { id: "b7", branchNum: 7, head: "Smt. P. Vijaylaxmi Naidu", spouse: "Late Shri Gopal Rao Naidu", status: "Alive", children: [{ name: "Veena Naidu", grandchildren: [] }, { name: "Deepa Naidu", grandchildren: [] }, { name: "Madhuri Naidu", grandchildren: [] }] },
                { id: "b8", branchNum: 8, head: "Late Shri Ramchandra Rao Gopal Rao Naidu", spouse: "Late Smt. Ramchandra Rao Naidu", status: "Deceased", children: [{ name: "Rajesh Naidu", grandchildren: [] }, { name: "Sunita Naidu", grandchildren: [] }] },
                { id: "b9", branchNum: 9, head: "Shri Laxman Rao Gopal Rao Naidu", spouse: "Late Smt. Laxman Rao Naidu", status: "Alive", children: [{ name: "Kirti Naidu", grandchildren: [] }] },
                { id: "b10", branchNum: 10, head: "Shri Chirnjiv Gopal Rao Naidu", spouse: "Smt. Chirnjiv Gopal Rao Naidu", status: "Alive", children: [{ name: "Jayant Naidu", grandchildren: [] }, { name: "Madhvi Naidu", grandchildren: [] }] },
                { id: "b11", branchNum: 11, head: "Shri Suryaprakash Rao Gopal Rao Naidu", spouse: "Smt. Suryaprakash Rao Naidu", status: "Alive", children: [{ name: "Manoj Naidu", grandchildren: [] }, { name: "Sangeeta Naidu", grandchildren: [] }, { name: "Ravi Naidu", grandchildren: [] }] },
                { 
                    id: "b12", branchNum: 12, head: "Shri Shankar Rao Naidu", spouse: "Smt. P. Rameshwari", status: "Alive",
                    children: [
                        { name: "Neeta Naidu", spouse: "V. Mukesh Rao", grandchildren: [{ name: "V. Miloni", photo: "" }, { name: "V. Nirav", photo: "" }] },
                        { name: "Leena Naidu", spouse: "Addanky Anil", grandchildren: [{ name: "Addanky Bhavya", photo: "" }, { name: "Addanky Kinjal", photo: "" }] },
                        { name: "Neelkanth Naidu", spouse: "J. Harika", grandchildren: [{ name: "Vartika Naidu", photo: "" }] }
                    ]
                },
                { id: "b13", branchNum: 13, head: "Late Shri Venkat Rao Gopal Rao Naidu", spouse: "Late Smt. Laxmi Naidu", status: "Deceased", children: [{ name: "Abhishek Naidu", grandchildren: [] }, { name: "Samyukta Naidu", grandchildren: [] }, { name: "Divya Naidu", grandchildren: [] }] }
            ]
        };

        let familyData = JSON.parse(localStorage.getItem('naidu_family_tree_db')) || defaultFamilyData;
        let isAdminLoggedIn = false;
        let currentView = 'home';
        let tempPhotoBase64 = "";

        window.addEventListener('DOMContentLoaded', () => { renderView(); });

        function navigateTo(v) { currentView = v; renderView(); window.scrollTo(0,0); }

        function renderView() {
            const container = document.getElementById('app-container');
            if (currentView === 'home') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="text-center py-6">
                            <h2 class="text-3xl font-bold font-serif">The Great Naidu Family Tree</h2>
                            <p class="text-sm text-slate-500 mt-1">Select any primary branch below to view children, grandchildren, and update photos.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            ${familyData.branches.map(b => `
                                <div onclick="navigateTo('${b.id}')" class="bg-white p-5 rounded-xl shadow cursor-pointer border hover:border-gold-500 transition-all flex items-center justify-between">
                                    <div>
                                        <span class="text-xs font-bold text-brand-800 bg-brand-50 px-2 py-0.5 rounded">Branch #${b.branchNum}</span>
                                        <h3 class="font-bold text-base mt-2">${b.head}</h3>
                                        <p class="text-xs text-slate-500 mt-0.5">Spouse: ${b.spouse || 'N/A'}</p>
                                    </div>
                                    <span class="text-brand-800 font-bold">&rarr;</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
            } else {
                const b = familyData.branches.find(x => x.id === currentView);
                container.innerHTML = `
                    <div class="space-y-6">
                        <button onclick="navigateTo('home')" class="text-xs text-brand-800 font-bold hover:underline">&larr; Back to All Branches</button>
                        <div class="bg-gradient-to-r from-brand-900 to-brand-800 text-white p-6 rounded-2xl shadow">
                            <span class="bg-gold-500 text-brand-900 text-xs font-bold px-2.5 py-1 rounded-full uppercase">Branch #${b.branchNum}</span>
                            <h2 class="text-2xl font-bold mt-2">${b.head}</h2>
                            <p class="text-xs text-amber-200 mt-1">Spouse: ${b.spouse}</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${b.children.map((c, cIdx) => `
                                <div class="bg-white p-4 rounded-xl border shadow-sm space-y-3">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-12 h-12 rounded-full overflow-hidden bg-slate-200">${c.photo ? `<img src="${c.photo}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center font-bold text-slate-400">'+c.name[0]+'</div>'}</div>
                                        <div><h4 class="font-bold">${c.name}</h4><p class="text-xs text-slate-500">m. ${c.spouse || 'N/A'}</p></div>
                                    </div>
                                    <div class="border-t pt-2">
                                        <div class="flex justify-between items-center text-xs font-bold mb-2">
                                            <span>Grandchildren (${c.grandchildren ? c.grandchildren.length : 0})</span>
                                            ${isAdminLoggedIn ? `<button onclick="openAddGrandchildModal('${b.id}', ${cIdx})" class="text-brand-800 hover:underline">+ Add Grandchild</button>` : ''}
                                        </div>
                                        <div class="space-y-2">
                                            ${c.grandchildren && c.grandchildren.length > 0 ? c.grandchildren.map((gc, gcIdx) => `
                                                <div class="bg-slate-50 p-2 rounded border flex items-center justify-between">
                                                    <div class="flex items-center space-x-2">
                                                        <div class="w-8 h-8 rounded-full overflow-hidden bg-slate-200">${gc.photo ? `<img src="${gc.photo}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center text-[10px] font-bold text-slate-400">'+gc.name[0]+'</div>'}</div>
                                                        <div><p class="text-xs font-bold">${gc.name}</p>${gc.spouse ? `<p class="text-[10px] text-slate-500">m. ${gc.spouse}</p>` : ''}</div>
                                                    </div>
                                                    ${isAdminLoggedIn ? `<button onclick="openEditModal('${b.id}', 'grandchild', ${cIdx},${gcIdx})" class="text-xs text-brand-800 font-bold underline">Edit/Photo</button>` : ''}
                                                </div>
                                            `).join('') : '<p class="text-xs text-slate-400 italic">No grandchildren added yet.</p>'}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
            }
            lucide.createIcons();
            document.getElementById('admin-banner').classList.toggle('hidden', !isAdminLoggedIn);
            document.getElementById('admin-btn-text').textContent = isAdminLoggedIn ? "Admin Active" : "Admin Login";
        }

        function toggleAdminModal() {
            if (isAdminLoggedIn) { logoutAdmin(); } 
            else { const pin = prompt("Enter Admin PIN (1234):"); if(pin === '1234') { isAdminLoggedIn = true; renderView(); } else if(pin) alert("Incorrect PIN"); }
        }
        function logoutAdmin() { isAdminLoggedIn = false; renderView(); }

        function openEditModal(branchId, type, childIdx, gcIdx) {
            document.getElementById('edit-branch-id').value = branchId;
            document.getElementById('edit-member-type').value = type;
            document.getElementById('edit-child-index').value = childIdx;
            document.getElementById('edit-gc-index').value = gcIdx;
            tempPhotoBase64 = "";

            const branch = familyData.branches.find(b => b.id === branchId);
            const gc = branch.children[childIdx].grandchildren[gcIdx];

            document.getElementById('edit-modal-title').textContent = `Edit Grandchild: ${gc.name}`;
            document.getElementById('edit-name').value = gc.name || '';
            document.getElementById('edit-spouse').value = gc.spouse || '';
            document.getElementById('edit-age').value = gc.age || '';
            document.getElementById('edit-photo-url').value = gc.photo || '';
            previewPhotoUrl(gc.photo || '');
            document.getElementById('modal-edit-member').classList.remove('hidden');
        }

        function openAddGrandchildModal(branchId, childIdx) {
            document.getElementById('edit-branch-id').value = branchId;
            document.getElementById('edit-member-type').value = 'new_grandchild';
            document.getElementById('edit-child-index').value = childIdx;
            document.getElementById('edit-gc-index').value = '';
            tempPhotoBase64 = "";

            document.getElementById('edit-modal-title').textContent = "Add New Grandchild";
            document.getElementById('edit-name').value = '';
            document.getElementById('edit-spouse').value = '';
            document.getElementById('edit-age').value = '';
            document.getElementById('edit-photo-url').value = '';
            previewPhotoUrl('');
            document.getElementById('modal-edit-member').classList.remove('hidden');
        }

        function handlePhotoUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { tempPhotoBase64 = e.target.result; previewPhotoUrl(tempPhotoBase64); };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function previewPhotoUrl(url) {
            const img = document.getElementById('photo-preview-img');
            const fallback = document.getElementById('photo-preview-fallback');
            if (url) { img.src = url; img.classList.remove('hidden'); fallback.classList.add('hidden'); }
            else { img.classList.add('hidden'); fallback.classList.remove('hidden'); }
        }

        function saveMemberChanges(e) {
            e.preventDefault();
            const branchId = document.getElementById('edit-branch-id').value;
            const type = document.getElementById('edit-member-type').value;
            const childIdx = document.getElementById('edit-child-index').value;
            const gcIdx = document.getElementById('edit-gc-index').value;

            const name = document.getElementById('edit-name').value;
            const spouse = document.getElementById('edit-spouse').value;
            const age = document.getElementById('edit-age').value;
            const photoUrl = tempPhotoBase64 || document.getElementById('edit-photo-url').value;

            const branch = familyData.branches.find(b => b.id === branchId);

            if (type === 'grandchild') {
                const gc = branch.children[childIdx].grandchildren[gcIdx];
                gc.name = name;
                gc.spouse = spouse;
                if(age) gc.age = parseInt(age);
                if(photoUrl) gc.photo = photoUrl;
            } else if (type === 'new_grandchild') {
                if(!branch.children[childIdx].grandchildren) branch.children[childIdx].grandchildren = [];
                branch.children[childIdx].grandchildren.push({
                    name: name,
                    spouse: spouse,
                    age: age ? parseInt(age) : null,
                    photo: photoUrl
                });
            }

            localStorage.setItem('naidu_family_tree_db', JSON.stringify(familyData));
            closeModal('modal-edit-member');
            renderView();
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
