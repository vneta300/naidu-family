        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, .font-serif-title {
            font-family: 'Playfair Display', Georgia, serif;
        }

        /* SVG Line Canvas Overlay styling */
        .tree-connector-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Node pulse effect for search highlight */
        @keyframes highlight-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
        }
        .highlight-node {
            animation: highlight-pulse 2s infinite;
            border-color: #f59e0b !important;
        }
    </style>

        // Draw SVG Connecting Lines from Root Node to Branch Nodes
        function drawConnectorLines() {
            const svg = document.getElementById('svg-connectors');
            const rootNode = document.getElementById('root-node');
            if (!svg || !rootNode) return;

            // Clear previous paths
            svg.innerHTML = '';

            const rootRect = rootNode.getBoundingClientRect();
            const svgRect = svg.getBoundingClientRect();

            // Root bottom-center coordinates relative to SVG canvas
            const startX = (rootRect.left + rootRect.width / 2) - svgRect.left;
            const startY = (rootRect.bottom) - svgRect.top;

            familyData.branches.forEach(branch => {
                const nodeElem = document.getElementById(`node-${branch.id}`);
                if (!nodeElem) return;

                const nodeRect = nodeElem.getBoundingClientRect();
                const endX = (nodeRect.left + nodeRect.width / 2) - svgRect.left;
                const endY = (nodeRect.top) - svgRect.top;

                // Bezier Curve Path calculation
                const deltaY = endY - startY;
                const pathD = `M ${startX} ${startY} C ${startX} ${startY + deltaY * 0.4}, ${endX} ${endY - deltaY * 0.4}, ${endX} ${endY}`;

                // Create SVG Path Element
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathD);
                path.setAttribute('stroke', '#cbd5e1'); // slate-300
                path.setAttribute('stroke-width', '2');
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke-dasharray', '4,4'); // Dashed line style
                svg.appendChild(path);
            });
        }

                                    <i data-lucide="heart" class="w-4 h-4 text-rose-400"></i>
                                    <span>Spouse: <strong>${b.spouse}</strong></span>
                                    ${b.spouseAge ? `<span class="bg-rose-500/30 text-rose-200 text-xs px-2 py-0.5 rounded-full border border-rose-400/40">Age: ${b.spouseAge}</span>` : ''}
                                </div>
                                <div class="flex items-center space-x-2">
                                    <i data-lucide="users" class="w-4 h-4 text-gold-400"></i>
                                    <span>Children: <strong>${b.children.length} Members</strong></span>
                                </div>
                                ${totalGrandchildren > 0 ? `
                                    <div class="flex items-center space-x-2">
                                        <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
                                        <span>Grandchildren: <strong>${totalGrandchildren} Members</strong></span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <!-- Lineage Parent Relationship Badge -->
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-center space-x-3 text-amber-900 text-sm">
                        <i data-lucide="git-merge" class="w-5 h-5 text-gold-600 flex-shrink-0"></i>
                        <div>
                            <strong>Direct Ancestry Link:</strong> This branch originates directly from 
                            <span class="underline font-semibold cursor-pointer" onclick="navigateTo('home')">Late Shri Gopal Rao Chirnjivlu Naidu & Late Smt. Narayan Amma</span>.
                        </div>
                    </div>

                    <!-- Children & Grandchildren Tree Hierarchy Section -->
                    <div class="space-y-6">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xl font-bold text-slate-900 font-serif-title flex items-center space-x-2">
                                <i data-lucide="users" class="w-5 h-5 text-brand-800"></i>
                                <span>Children & Grandchildren Lineage (${b.children.length})</span>
                            </h3>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${b.children.map(child => `
                                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between space-y-4 relative">
                                    <!-- Child Header Node -->
                                    <div class="flex items-start space-x-4">
                                        <div class="w-12 h-12 rounded-full bg-brand-50 border border-brand-200 flex items-center justify-center text-brand-800 font-bold text-lg flex-shrink-0">
                                            ${child.name.charAt(0)}
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <h4 class="font-bold text-slate-900 text-base leading-snug">${child.name}</h4>
                                            <p class="text-xs text-slate-500 mt-0.5">Relation: ${child.role || 'Member'}</p>
                                            
                                            ${child.spouse ? `
                                                <div class="mt-2 inline-flex items-center space-x-1.5 bg-rose-50 text-rose-800 text-xs font-semibold px-2.5 py-1 rounded-lg border border-rose-200">
                                                    <i data-lucide="heart" class="w-3 h-3 text-rose-500"></i>
                                                    <span>Married to: <strong>${child.spouse}</strong></span>
                                                </div>
                                            ` : ''}

                                            ${child.age ? `
                                                <div class="mt-2 inline-flex items-center space-x-1 bg-amber-50 text-amber-800 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-amber-200">
                                                    <i data-lucide="calendar" class="w-3 h-3 text-gold-600"></i>
                                                    <span>Age: ${child.age} years</span>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>

                                    <!-- Grandchildren Sub-Tree Nodes (If present) -->
                                    ${child.children && child.children.length > 0 ? `
                                        <div class="pt-4 border-t border-slate-100 bg-slate-50/80 -mx-6 -mb-6 p-4 rounded-b-2xl">
                                            <div class="flex items-center space-x-1.5 text-xs font-bold text-slate-600 uppercase tracking-wider mb-3">
                                                <i data-lucide="corner-down-right" class="w-4 h-4 text-brand-800"></i>
                                                <span>Grandchildren (${child.children.length})</span>
                                            </div>
                                            <div class="space-y-2 pl-2">
                                                ${child.children.map(grandchild => `
                                                    <div class="flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-200 text-xs shadow-2xs">
                                                        <div class="flex items-center space-x-2">
                                                            <div class="w-6 h-6 rounded-full bg-amber-100 text-amber-900 flex items-center justify-center font-bold text-[10px]">
                                                                ${grandchild.name.charAt(0)}
                                                            </div>
                                                            <span class="font-semibold text-slate-800">${grandchild.name}</span>
                                                        </div>
                                                        <span class="text-[10px] text-slate-400 font-medium">${grandchild.role || 'Grandchild'}</span>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Quick Navigation to Other Branches Carousel/Grid -->
                    <div class="pt-8 border-t border-slate-200 space-y-4">
                        <h4 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Switch to another Family Branch</h4>
                        <div class="flex space-x-3 overflow-x-auto pb-4 pt-1">
                            ${familyData.branches.map(other => `
                                <button onclick="navigateTo('${other.id}')" 
                                    class="flex-shrink-0 px-4 py-2.5 rounded-xl border ${other.id === b.id ? 'bg-brand-900 text-white border-brand-900' : 'bg-white text-slate-700 border-slate-200 hover:border-gold-500'} text-xs font-semibold shadow-sm transition-all flex items-center space-x-2">
                                    <span>#${other.branchNum} ${other.head.replace('Late Shri ', '').replace('Late Smt. ', '')}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // -------------------------------------------------------------
        // GLOBAL SEARCH ENGINE LOGIC
        // -------------------------------------------------------------
        function handleSearch(query) {
            const dropdown = document.getElementById('search-results-dropdown');
            const clearBtn = document.getElementById('search-clear-btn');
            
            if (!query || query.trim() === '') {
                dropdown.classList.add('hidden');
                clearBtn.classList.add('hidden');
                return;
            }

            clearBtn.classList.remove('hidden');
            const searchTerm = query.toLowerCase().trim();
            const matches = [];

            // Search Root Parents
            if (familyData.root.head.toLowerCase().includes(searchTerm) || familyData.root.spouse.toLowerCase().includes(searchTerm)) {
                matches.push({
                    name: `${familyData.root.head} & ${familyData.root.spouse}`,
                    type: "Root Ancestors",
                    action: () => navigateTo('home')
                });
            }

            // Search Primary Branch Heads & Spouses & Children & Grandchildren
            familyData.branches.forEach(b => {
                if (b.head.toLowerCase().includes(searchTerm)) {
                    matches.push({
                        name: b.head,
                        type: `Branch #${b.branchNum} Head`,
                        action: () => navigateTo(b.id)
                    });
                }
                if (b.spouse && b.spouse.toLowerCase().includes(searchTerm)) {
                    matches.push({
                        name: b.spouse,
                        type: `Spouse in Branch #${b.branchNum}`,
                        action: () => navigateTo(b.id)
                    });
                }
                b.children.forEach(c => {
                    if (c.name.toLowerCase().includes(searchTerm)) {
                        matches.push({
                            name: c.name + (c.age ? ` (${c.age} yrs)` : ''),
                            type: `Child in Branch #${b.branchNum} (${b.head.replace('Late Shri ', '')})`,
                            action: () => navigateTo(b.id)
                        });
                    }
                    if (c.spouse && c.spouse.toLowerCase().includes(searchTerm)) {
                        matches.push({
                            name: c.spouse,
                            type: `Spouse of ${c.name} in Branch #${b.branchNum}`,
                            action: () => navigateTo(b.id)
                        });
                    }
                    if (c.children) {
                        c.children.forEach(gc => {
                            if (gc.name.toLowerCase().includes(searchTerm)) {
                                matches.push({
                                    name: gc.name,
                                    type: `Grandchild in Branch #${b.branchNum} (${c.name}'s child)`,
                                    action: () => navigateTo(b.id)
                                });
                            }
                        });
                    }
                });
            });

            // Render Results
            if (matches.length > 0) {
                dropdown.innerHTML = matches.map((m, idx) => `
                    <div onclick="executeSearchAction(${idx})" class="p-3 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-none flex items-center justify-between">
                        <div>
                            <p class="font-semibold text-slate-800 text-sm">${m.name}</p>
                            <p class="text-xs text-brand-800">${m.type}</p>
                        </div>
                        <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-400"></i>
                    </div>
                `).join('');
                dropdown.dataset.matches = JSON.stringify(matches);
                dropdown.classList.remove('hidden');
            } else {
                dropdown.innerHTML = `<div class="p-4 text-center text-xs text-slate-500">No family member matching "${query}"</div>`;
                dropdown.classList.remove('hidden');
            }
            
            lucide.createIcons();
        }

        function executeSearchAction(index) {
            const dropdown = document.getElementById('search-results-dropdown');
            const matches = JSON.parse(dropdown.dataset.matches || '[]');
            if (matches[index]) {
                matches[index].action();
                dropdown.classList.add('hidden');
                document.getElementById('global-search').value = '';
                document.getElementById('search-clear-btn').classList.add('hidden');
            }
        }

        function clearSearch() {
            document.getElementById('global-search').value = '';
            document.getElementById('search-results-dropdown').classList.add('hidden');
            document.getElementById('search-clear-btn').classList.add('hidden');
        }
    </script>
</body>
</html>
